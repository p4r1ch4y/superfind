[package]
name = "superfind-cli"
description = "Locate a Bluetooth device by signal strength, from a Linux or Windows terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "superfind"
path = "src/main.rs"

[dependencies]
superfind-core = { path = "../superfind-core" }
anyhow = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

# BlueZ over D-Bus, in pure Rust. Deliberately not btleplug: its Linux backend
# links libdbus, so building it needs `libdbus-1-dev` and root to install it.
# Requiring a system package to try the thing is a bad first impression, and
# zbus removes the C toolchain from the picture entirely.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
