name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Test the core before shipping it
        run: cargo test --workspace

      - name: Build native core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: ./scripts/build-jni.sh

      - name: Assemble APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the artefact after the tag
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/superfind-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum *.apk > checksums.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Debug-signed APK. Android 6.0 (API 23) and above, all ABIs.

            Unsigned for release, so Android will warn on install — this is a
            private build, not a store release. Enable installation from
            unknown sources to proceed.

            Needs Bluetooth and nearby-devices permission. Location is never
            requested on Android 12+.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES" \
            dist/*.apk dist/checksums.txt
