name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Test the core before shipping it
        run: cargo test --workspace

      - name: Build native core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: ./scripts/build-jni.sh

      - name: Assemble APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # The Linux CLI ships too: it shares the fusion core with the app, and is
      # the only front end where ground truth is exact enough to validate it.
      - name: Build the CLI
        run: cargo build --release -p superfind-cli

      - name: Collect artefacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/superfind-${GITHUB_REF_NAME}.apk"
          cp target/release/superfind \
             "dist/superfind-${GITHUB_REF_NAME}-linux-x86_64"
          (cd dist && sha256sum superfind-* > checksums.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            ### Android

            `superfind-${{ github.ref_name }}.apk` — Android 6.0 (API 23) and
            above, all ABIs, with the Rust fusion core built in.

            Debug-signed, so Android warns on install: this is a private build,
            not a store release. Allow installation from unknown sources to
            proceed.

            Needs Bluetooth and nearby-devices permission. Location is never
            requested on Android 12 and later.

            ### Linux

            `superfind-${{ github.ref_name }}-linux-x86_64` — the CLI. Needs
            `bluetoothd` running and an adapter powered on; no root required.

            ```sh
            chmod +x superfind-*-linux-x86_64
            ./superfind-*-linux-x86_64            # survey
            ./superfind-*-linux-x86_64 <name>     # hunt one device
            ```

            Verify either download against `checksums.txt`.
        run: |
          # Upload everything in dist, not a hand-written list — an earlier
          # version enumerated `dist/*.apk dist/checksums.txt` and silently
          # dropped the CLI binary that the previous step had just built.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "$NOTES" \
              dist/*
          fi
