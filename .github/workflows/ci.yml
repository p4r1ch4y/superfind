name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The fusion filter is the product; these tests are the reason it can be
      # trusted on a phone without being debugged on one.
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Build native core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: ./scripts/build-jni.sh

      - name: Assemble and lint
        working-directory: android
        run: ./gradlew assembleDebug lintDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: superfind-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
