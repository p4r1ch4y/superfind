[workspace]
resolver = "2"
members = ["crates/superfind-core", "crates/superfind-cli", "crates/superfind-jni"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.85 is the real floor: dependencies pull in the 2024 edition, which is not
# stabilised before it.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/p4r1ch4y/superfind"

[profile.release]
opt-level = 3
lto = "thin"
